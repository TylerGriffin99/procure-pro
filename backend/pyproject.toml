[project]
name = "procure-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "anthropic>=0.40.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "openai>=2.35.1",
    "openpyxl>=3.1.0",
    "pydantic-ai-slim[openai]>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "full_pipeline: Full 8-claim e2e pipeline test (slow, requires all PDFs + LLM)",
    "eval: Nondeterministic, paid matcher eval (real Jev + LLM). Excluded from the default suite; run via `just eval`.",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
