[project]
name = "procure-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "anthropic>=0.40.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "openai>=2.35.1",
    "openpyxl>=3.1.0",
    "pydantic-ai-slim[openai]>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "full_pipeline: Full 8-claim e2e pipeline test (slow, requires all PDFs + LLM)",
    "eval: Nondeterministic, paid matcher eval (real Jev + LLM). Excluded from the default suite; run via `just eval`.",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ── Lint & type-check (app code only) ────────────────────────────────────────
# These gates cover the application package `app/`. Test code (`app/tests`,
# `tests`), DB migrations (`alembic`) and one-off `scripts` are intentionally
# excluded. Run via `just lint` and `just typecheck`.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["app/tests", "tests", "alembic", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "G", "LOG", "ASYNC", "RUF"]
ignore = [
    "E501",     # line length is formatting, not a correctness gate
    "UP042",    # keep `(str, enum.Enum)` — StrEnum changes str()/serialization semantics
    "ASYNC109", # our async clients take a `timeout` passed straight to httpx, not an asyncio timeout
    "RUF003",   # ambiguous-unicode in comments (prose) is noise
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are call-in-argument-default by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Security", "fastapi.Cookie",
]

[tool.ty.src]
include = ["app"]
exclude = ["app/tests", "tests", "alembic", "scripts"]
